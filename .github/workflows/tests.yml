name: tests
# Installs the formula from this tap on macOS and Linux and runs its test and the audit.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install net-merge from the tap
        run: |
          brew tap net-merge/tap
          brew install net-merge/tap/net-merge
          brew test net-merge/tap/net-merge
          net-merge version
      - name: Audit the formula
        run: brew audit --strict --online net-merge/tap/net-merge
